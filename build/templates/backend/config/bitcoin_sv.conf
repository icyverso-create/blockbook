{{define "main" -}}
daemon=1
server=1
{{if .Backend.Mainnet}}{{else}}testnet=1{{end}}
nolisten=1
rpcuser={{.IPC.RPCUser}}
rpcpassword={{.IPC.RPCPass}}
rpcport={{.Ports.BackendRPC}}
rpcbind={{.Env.RPCBindHost}}
rpcallowip={{.Env.RPCAllowIP}}
txindex=1

zmqpubhashtx={{template "IPC.MessageQueueBindingTemplate" .}}
zmqpubhashblock={{template "IPC.MessageQueueBindingTemplate" .}}

# bitcoind refuses to start unless these three are set explicitly
# (src/bitcoind.cpp:140-164). Both consensus knobs are set to 0, the documented
# "no locally imposed limit" (src/init.cpp:1055-1060; excessiveblocksize=0 falls
# back to MAIN_DEFAULT_MAX_BLOCK_SIZE = INT64_MAX, src/policy/policy.h:39 via
# src/config.cpp:222-236), because a limit stricter than the network's makes
# this node reject blocks and scripts the network accepts - mainnet already has
# blocks of almost 4 GB, which the old 1 GB excessiveblocksize would reject.
# minminingtxfee is DEFAULT_BLOCK_MIN_TX_FEE, 500 satoshi/kB (policy.h:66).
excessiveblocksize=0
maxstackmemoryusageconsensus=0
minminingtxfee=0.00000500

# A single getblock(verbosity=0) response here can be several GB of hex, far
# past the 30 s DEFAULT_HTTP_SERVER_TIMEOUT (src/httpserver.h:14, applied in
# src/httpserver.cpp:343), and it holds one of the 4 default DEFAULT_HTTP_THREADS
# for minutes while the mempool workers need the rest.
rpcservertimeout=900
rpcthreads=16

rpcworkqueue=1100
maxmempool=2000
dbcache=1000

{{- if .Backend.AdditionalParams}}
# generated from additional_params
{{- range $name, $value := .Backend.AdditionalParams}}
{{- if eq $name "addnode"}}
{{- range $index, $node := $value}}
addnode={{$node}}
{{- end}}
{{- else}}
{{$name}}={{$value}}
{{- end}}
{{- end}}
{{- end}}
{{end}}
